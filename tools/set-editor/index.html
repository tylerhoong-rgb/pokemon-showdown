<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Editor</title>
<style>
:root {
	--bg: #14171c; --panel: #1b1f26; --panel2: #222832; --line: #2f3744; --text: #e6e9ef; --muted: #8b95a7;
	--accent: #5aa2ff; --accent-bg: rgba(90,162,255,.14); --good: #4cc38a; --warn: #e8b74a; --bad: #ef6a6a;
	--bad-bg: rgba(239,106,106,.14); --warn-bg: rgba(232,183,74,.14); --shadow: 0 8px 30px rgba(0,0,0,.45);
	--radius: 10px;
	color-scheme: dark;
}
@media (prefers-color-scheme: light) {
	:root {
		--bg: #f3f4f7; --panel: #ffffff; --panel2: #f0f2f6; --line: #d9dde6; --text: #1d2330; --muted: #667085;
		--accent: #2563d9; --accent-bg: rgba(37,99,217,.1); --good: #1b8a56; --warn: #a56a00; --bad: #cc3333;
		--bad-bg: rgba(204,51,51,.09); --warn-bg: rgba(165,106,0,.1); --shadow: 0 8px 30px rgba(20,30,60,.18);
		color-scheme: light;
	}
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 3px 7px; }
button.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
input[type=text], input[type=number], input[type=search], select {
	background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; min-width: 0;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.topbar h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 700; letter-spacing: .2px; }
.topbar .file { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; }
.topbar .spacer { flex: 1; }
.status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.dot.dirty { background: var(--warn); }

/* layout */
.app { flex: 1; display: grid; grid-template-columns: 290px 1fr; min-height: 0; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.side-head { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.side-head .row { display: flex; gap: 6px; }
.side-head input[type=search] { flex: 1; }
.list { overflow: auto; flex: 1; padding: 4px; }
.sp { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 3px 8px; }
.sp:hover { background: var(--panel2); }
.sp.on { background: var(--accent-bg); border-color: var(--accent); }
.sp img, .sprite { width: 36px; height: 36px; object-fit: contain; image-rendering: pixelated; flex: none; }
.sp .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp .ct { color: var(--muted); font-size: 12px; }
.sp .flag { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); flex: none; }
.sp .flag.warn { background: var(--warn); }
.side-foot { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.main { overflow: auto; padding: 18px 22px 60px; min-width: 0; }

/* species header */
.sphead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.sphead .sprite { width: 64px; height: 64px; }
.sphead h2 { margin: 0; font-size: 22px; }
.sphead .id { color: var(--muted); font-size: 12px; }
.types { display: flex; gap: 4px; margin-top: 4px; }
.tb { font-size: 11px; font-weight: 700; letter-spacing: .3px; color: #fff; padding: 1px 8px; border-radius: 99px; text-transform: uppercase; }
.lvl { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.lvl input { width: 64px; color: var(--text); }
.bst { display: grid; grid-template-columns: repeat(6, 38px); gap: 4px; }
.bst div { text-align: center; font-size: 11px; color: var(--muted); }
.bst b { display: block; color: var(--text); font-size: 13px; }
.bst i { display: block; height: 3px; border-radius: 2px; margin-top: 2px; }
.sphead .grow { flex: 1; }

/* set cards */
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 14px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 14px; display: grid; gap: 12px; }
.card-head { display: flex; align-items: center; gap: 6px; }
.card-head .title { font-weight: 700; flex: 1; }
.card-head .role-tag { color: var(--muted); font-weight: 400; margin-left: 6px; }
.field { display: grid; gap: 4px; }
.field > label, .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.field .hint, .lbl .hint { text-transform: none; letter-spacing: 0; font-size: 12px; opacity: .85; }
.push { margin-left: auto; }
.mode { text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px; min-height: 38px; }
.chips:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 9px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; }
.chip.typed { color: #fff; border-color: transparent; }
.chip.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.chip button { all: unset; cursor: pointer; opacity: .6; padding: 0 5px; line-height: 1; border-radius: 99px; }
.chip button:hover { opacity: 1; background: rgba(0,0,0,.25); }
.chips input { flex: 1; min-width: 110px; border: none; background: transparent; outline: none !important; padding: 3px 4px; }
.pills { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { border: 2px solid transparent; border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 700; color: #fff; text-transform: uppercase; opacity: .38; letter-spacing: .3px; }
.pill:hover:not(:disabled) { opacity: .75; border-color: transparent; }
.pill.on { opacity: 1; border-color: var(--text); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field select, .field > input { width: 100%; }
.mode { font-size: 11.5px; }

/* EVs */
.evs { display: grid; grid-template-columns: 38px 1fr 58px 40px 46px; gap: 4px 8px; align-items: center; font-size: 13px; }
.evs .st { font-weight: 600; }
.evs input[type=range] { width: 100%; accent-color: var(--accent); }
.evs input[type=number] { width: 58px; padding: 3px 5px; }
.evs .bs { color: var(--muted); text-align: right; font-size: 12px; }
.evs .fin { text-align: right; font-weight: 700; }
.evs .nat-up { color: var(--good); } .evs .nat-dn { color: var(--bad); }
.evs .hd { font-size: 10.5px; text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }
.evtotal { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.evtotal b.over { color: var(--bad); } .evtotal b.ok { color: var(--good); }
.default-box { background: var(--panel2); border: 1px dashed var(--line); border-radius: 8px; padding: 9px 11px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.default-box span { flex: 1; font-size: 12.5px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
.issues { display: grid; gap: 4px; }
.issue { font-size: 12.5px; padding: 4px 9px; border-radius: 7px; background: var(--warn-bg); color: var(--warn); }
.issue.error { background: var(--bad-bg); color: var(--bad); }
.banner { margin-bottom: 12px; }

/* autocomplete */
.ac { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); max-height: 300px; overflow: auto; padding: 3px; }
.ac-item { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.ac-item.on, .ac-item:hover { background: var(--accent-bg); }
.ac-item .sub { color: var(--muted); font-size: 12px; margin-left: auto; padding-left: 14px; }
.ac-item .dim { opacity: .55; }
.ac-item .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }

/* misc */
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 9px; padding: 9px 16px; z-index: 100; }
.toast.error { border-color: var(--bad); color: var(--bad); }
.toast.good { border-color: var(--good); }
.welcome { max-width: 560px; margin: 8vh auto; text-align: center; display: grid; gap: 14px; }
.welcome .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 36px 20px; }
.welcome .drop.over { border-color: var(--accent); background: var(--accent-bg); }
.welcome code { background: var(--panel2); padding: 2px 6px; border-radius: 5px; }
.muted { color: var(--muted); }
pre.raw { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; }
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: start center; padding-top: 14vh; z-index: 60; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; width: min(440px, 92vw); display: grid; gap: 10px; box-shadow: var(--shadow); }
.modal h3 { margin: 0; font-size: 16px; }
.modal input { width: 100%; }

@media (max-width: 860px) {
	.app { grid-template-columns: 1fr; grid-template-rows: 38vh 1fr; }
	.side { border-right: none; border-bottom: 1px solid var(--line); }
	.sets { grid-template-columns: 1fr; }
	.main { padding: 14px 12px 60px; }
}
</style>
</head>
<body>
<div class="topbar">
	<h1>Set Editor</h1>
	<span class="file" id="fileLabel"></span>
	<span class="status" id="status"></span>
	<span class="spacer"></span>
	<button id="btnUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
	<button id="btnRedo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
	<button id="btnRaw" title="Show the JSON that will be saved">{ } JSON</button>
	<button id="btnOpen">Open…</button>
	<button id="btnSave" class="primary" title="Save (Ctrl+S)">Save</button>
</div>
<div class="app" id="app"></div>
<input type="file" id="filePick" accept=".json,application/json" hidden>
<datalist id="roles"></datalist>
<script src="dex-data.js"></script>
<script src="format.js"></script>
<script>
'use strict';
/* ---------------------------------------------------------------- helpers */
const D = window.DEX;
const { serialize } = window.SetFormat;
const toID = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '');
const $ = (s, el = document) => el.querySelector(s);
const STATS = ['HP', 'Atk', 'Def', 'SpA', 'SpD', 'Spe'];
const KEY_ORDER = ['role', 'movepool', 'abilities', 'teraTypes', 'item', 'evs', 'ivs', 'nature'];
const TYPE_COLORS = {
	Normal: '#8a8a59', Fire: '#e5622b', Water: '#4f7fe8', Electric: '#d9a912', Grass: '#4fa83c', Ice: '#5cb3b3',
	Fighting: '#b02a22', Poison: '#8b2f8b', Ground: '#c9a24a', Flying: '#8a74d6', Psychic: '#e04274', Bug: '#8aa012',
	Rock: '#8e7a24', Ghost: '#5b4690', Dragon: '#5e24e8', Dark: '#5a463a', Steel: '#8d8dac', Fairy: '#d9779a', Stellar: '#3aa6a0',
};
const TERA_TYPES = [...D.types, 'Stellar'];

const index = {
	species: new Map(D.species.map(s => [s.id, s])),
	moves: new Map(D.moves.map(m => [toID(m.name), m])),
	abilities: new Map(D.abilities.map(a => [toID(a.name), a])),
	items: new Map(D.items.map(i => [toID(i.name), i])),
	natures: new Map(D.natures.map(n => [toID(n.name), n])),
};

function h(tag, props, ...kids) {
	const el = document.createElement(tag);
	let value;
	for (const [k, v] of Object.entries(props || {})) {
		if (v == null || v === false) continue;
		if (k === 'value') value = v;
		else if (k === 'class') el.className = v;
		else if (k === 'style') el.style.cssText = v;
		else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
		else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
		else el.setAttribute(k, v === true ? '' : v);
	}
	for (const kid of kids.flat(Infinity)) {
		if (kid == null || kid === false) continue;
		el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
	}
	if (value !== undefined) el.value = value;
	return el;
}
const typeBadge = t => h('span', { class: 'tb', style: `background:${TYPE_COLORS[t] || '#666'}` }, t);
const clone = x => JSON.parse(JSON.stringify(x));
const natureMult = (nat, i) => {
	const n = index.natures.get(toID(nat || ''));
	if (!n) return 1;
	const key = ['hp', 'atk', 'def', 'spa', 'spd', 'spe'][i];
	return n.plus === key ? 1.1 : n.minus === key ? 0.9 : 1;
};
const getStat = (obj, stat, dflt) => {
	if (!obj) return dflt;
	for (const k of Object.keys(obj)) if (k.toLowerCase() === stat.toLowerCase()) return Number(obj[k]);
	return dflt;
};
function fixOrder(set) {
	const copy = { ...set };
	for (const k of Object.keys(set)) delete set[k];
	for (const k of KEY_ORDER) if (k in copy) set[k] = copy[k];
	for (const k of Object.keys(copy)) if (!(k in set)) set[k] = copy[k];
}
function toast(msg, kind = '') {
	document.querySelectorAll('.toast').forEach(t => t.remove());
	const t = h('div', { class: 'toast ' + kind }, msg);
	document.body.append(t);
	setTimeout(() => t.remove(), kind === 'error' ? 6000 : 2600);
}

/* ---------------------------------------------------------------- state */
let data = null;
let baseline = '';
let fileName = '';
let mode = 'none'; // 'server' | 'fs' | 'upload'
let fsHandle = null;
let selected = null;
let past = [], future = [];
let lastKey = null, lastTime = 0;
let showRaw = false;
let filterText = '';
let sortMode = 'file';
let scrollToSelected = false;
let issueMap = new Map();

const isDirty = () => !!data && serialize(data) !== baseline;

function mutate(fn, key) {
	const now = Date.now();
	if (!(key && key === lastKey && now - lastTime < 1200)) {
		past.push(JSON.stringify(data));
		if (past.length > 200) past.shift();
	}
	lastKey = key || null;
	lastTime = now;
	future = [];
	fn();
	render();
}
function undo() {
	if (!past.length) return;
	future.push(JSON.stringify(data));
	data = JSON.parse(past.pop());
	lastKey = null;
	if (!data[selected]) selected = Object.keys(data)[0] || null;
	render();
}
function redo() {
	if (!future.length) return;
	past.push(JSON.stringify(data));
	data = JSON.parse(future.pop());
	lastKey = null;
	if (!data[selected]) selected = Object.keys(data)[0] || null;
	render();
}
const editSet = (spId, i, fn, key) => mutate(() => {
	const set = data[spId].sets[i];
	fn(set);
	fixOrder(set);
}, key && `${spId}:${i}:${key}`);

/* ---------------------------------------------------------------- validation */
function validateAll() {
	const map = new Map();
	for (const [id, sp] of Object.entries(data)) map.set(id, validateSpecies(id, sp));
	return map;
}
function validateSpecies(id, sp) {
	const out = []; // {set: index|null, level, msg}
	const dex = index.species.get(id);
	if (!dex) out.push({ set: null, level: 'error', msg: `"${id}" is not a species id in the Pokédex.` });
	if (!Array.isArray(sp.sets) || !sp.sets.length) {
		out.push({ set: null, level: 'error', msg: 'No sets — the team generator needs at least one.' });
		return out;
	}
	if (sp.level != null && !(sp.level >= 1 && sp.level <= 100)) out.push({ set: null, level: 'error', msg: 'Level must be between 1 and 100.' });
	sp.sets.forEach((s, i) => {
		const add = (level, msg) => out.push({ set: i, level, msg });
		if (!Array.isArray(s.movepool) || !s.movepool.length) add('error', 'Movepool is empty.');
		else {
			const seen = new Set();
			for (const m of s.movepool) {
				if (!index.moves.has(toID(m))) add('error', `Unknown move "${m}".`);
				if (seen.has(toID(m))) add('warn', `Duplicate move "${m}".`);
				seen.add(toID(m));
			}
		}
		if (!Array.isArray(s.abilities) || !s.abilities.length) add('error', 'No ability chosen.');
		else for (const a of s.abilities) {
			if (!index.abilities.has(toID(a))) add('error', `Unknown ability "${a}".`);
			else if (dex && dex.abilities.length && !dex.abilities.some(x => toID(x) === toID(a))) add('warn', `${dex.name} doesn't normally have ${a}.`);
		}
		for (const t of s.teraTypes || []) if (!TERA_TYPES.includes(t)) add('error', `Unknown Tera type "${t}".`);
		const items = s.item == null ? [] : Array.isArray(s.item) ? s.item : [s.item];
		for (const it of items) if (it !== '' && !index.items.has(toID(it))) add('error', `Unknown item "${it}".`);
		if (s.nature != null && !index.natures.has(toID(s.nature))) add('error', `Unknown nature "${s.nature}".`);
		if (s.evs) {
			let total = 0;
			for (const st of STATS) {
				const v = getStat(s.evs, st, 0);
				total += v;
				if (v > 252 || v < 0) add('error', `${st} EVs must be 0–252 (is ${v}).`);
			}
			if (total > 510) add('error', `EV total is ${total} (max 510).`);
		}
		if (s.ivs) for (const st of STATS) {
			const v = getStat(s.ivs, st, 31);
			if (v < 0 || v > 31) add('error', `${st} IVs must be 0–31 (is ${v}).`);
		}
	});
	return out;
}
const countIssues = (level) => [...issueMap.values()].reduce((n, l) => n + l.filter(x => !level || x.level === level).length, 0);

/* ---------------------------------------------------------------- autocomplete */
function searchDex(list, q, exclude, extra) {
	const nq = toID(q);
	if (!nq) return [];
	const lq = q.toLowerCase().trim();
	const res = [];
	for (const e of list) {
		const id = toID(e.name);
		if (exclude.has(id)) continue;
		let score;
		if (id.startsWith(nq)) score = 0;
		else if (e.name.toLowerCase().split(/[\s\-']+/).some(w => w.startsWith(lq))) score = 1;
		else if (id.includes(nq)) score = 2;
		else continue;
		res.push({ e, score });
	}
	res.sort((a, b) => a.score - b.score || (a.e.ns || 0) - (b.e.ns || 0) || a.e.name.length - b.e.name.length || a.e.name.localeCompare(b.e.name));
	return res.slice(0, 10).map(r => r.e);
}
function attachAC(input, search, pick) {
	let box = null, items = [], idx = 0;
	const close = () => { if (box) box.remove(); box = null; items = []; };
	const open = () => {
		const q = input.value.trim();
		items = search(q);
		if (!items.length) return close();
		idx = Math.max(0, Math.min(idx, items.length - 1));
		if (!box) { box = h('div', { class: 'ac' }); document.body.append(box); }
		box.replaceChildren(...items.map((it, i) => h('div', {
			class: 'ac-item' + (i === idx ? ' on' : ''),
			onmousedown: e => { e.preventDefault(); choose(i); },
		}, ...it.node())));
		const r = input.getBoundingClientRect();
		box.style.minWidth = Math.max(r.width, 240) + 'px';
		const bh = Math.min(300, box.scrollHeight + 8);
		const below = window.innerHeight - r.bottom;
		box.style.left = Math.min(r.left, window.innerWidth - 260) + 'px';
		box.style.top = (below < bh + 10 && r.top > bh ? r.top - bh - 2 : r.bottom + 2) + 'px';
		const on = box.children[idx];
		if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
	};
	const choose = i => { const it = items[i]; close(); input.value = ''; if (it) pick(it.value); };
	input.addEventListener('input', () => { idx = 0; open(); });
	input.addEventListener('focus', () => { idx = 0; open(); });
	input.addEventListener('blur', close);
	input.addEventListener('keydown', e => {
		if (e.key === 'ArrowDown') { e.preventDefault(); if (!box) open(); else { idx = Math.min(items.length - 1, idx + 1); open(); } }
		else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); open(); }
		else if (e.key === 'Escape') { close(); }
		else if (e.key === 'Enter' || e.key === ',') {
			if (box && items.length) { e.preventDefault(); choose(idx); }
			else if (input.value.trim()) { e.preventDefault(); const v = input.value.trim(); close(); input.value = ''; pick(v); }
		}
	});
}
/** Build a search function for a dex list: results get a "node" renderer and a final "add anyway" option. */
function dexSearch(list, render, exclude, empty) {
	return q => {

		const found = searchDex(list, q, exclude);
		const res = found.map(e => ({ value: e.name, node: () => render(e) }));

/* ---------------------------------------------------------------- reusable editors */
function chipEditor({ values, kind, search, onChange, placeholder, single, fk }) {
	const valid = v => kind === 'move' ? index.moves.has(toID(v)) : kind === 'ability' ? index.abilities.has(toID(v)) : kind === 'item' ? index.items.has(toID(v)) : true;
	const wrap = h('div', { class: 'chips', onclick: e => { if (e.target === wrap) input.focus(); } });
	for (const v of values) {
		const mv = kind === 'move' ? index.moves.get(toID(v)) : null;
		const bad = !valid(v);
		wrap.append(h('span', { class: 'chip' + (bad ? ' bad' : mv ? ' typed' : ''), style: mv && !bad ? `background:${TYPE_COLORS[mv.type]}` : '', title: bad ? 'Not found in the dex' : '' },
			v, h('button', { title: 'Remove', onclick: () => onChange(values.filter(x => x !== v)) }, '×')));

	const input = h('input', { type: 'text', 'data-fk': fk, placeholder: (single && values.length) ? 'replace…' : placeholder, autocomplete: 'off', spellcheck: 'false' });

}

function finalStat(i, base, ev, iv, level, nature) {
	if (!base) return '';
	const e = Math.floor(ev / 4);
	if (i === 0) return base === 1 ? 1 : Math.floor((2 * base + iv + e) * level / 100) + level + 10;
	return Math.floor((Math.floor((2 * base + iv + e) * level / 100) + 5) * natureMult(nature, i));
}

function evEditor(spId, si, set, dex, level) {

			h('input', { type: 'number', min: 0, max: 252, step: 4, value: ev, 'data-fk': `ev-${si}-${st}`, onchange: e => setEV(st, e.target.value) }),
			h('span', { class: 'bs' }, base || ''),

	);
}

	drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) f.text().then(t => loadText(t, f.name, 'upload')); });
	return h('div', { class: 'welcome' }, h('h2', { style: 'margin:0' }, 'Pokémon Showdown set editor'), drop,
		h('p', { class: 'muted', style: 'margin:0' }, 'To edit the repo file in place, run ', h('code', {}, 'node tools/set-editor/server.mjs'), ' and open the printed address.'));
}
function loadText(text, name, how, handle) {
	let parsed;
	try { parsed = JSON.parse(text); } catch (e) { return toast('Not valid JSON: ' + e.message, 'error'); }
	if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return toast('Expected an object of species → { level, sets }.', 'error');
	for (const [id, sp] of Object.entries(parsed)) {
		if (!sp || typeof sp !== 'object' || !Array.isArray(sp.sets)) return toast(`"${id}" doesn't look like { level, sets: [...] }.`, 'error');
	}
	data = parsed; baseline = serialize(data); fileName = name; mode = how; fsHandle = handle || null;
	past = []; future = []; lastKey = null; showRaw = false; filterText = '';
	let saved = null;
	try { saved = localStorage.getItem('setEditor.selected'); } catch (e) {}
	selected = data[saved] ? saved : Object.keys(data)[0] || null;
	scrollToSelected = true;
	const app = $('#app'); app.replaceChildren();
	render();
}
async function openFile() {
	if (window.showOpenFilePicker) {
		try {
			const [handle] = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
			const f = await handle.getFile();
			return loadText(await f.text(), f.name, 'fs', handle);
		} catch (e) { if (e.name === 'AbortError') return; }
	}
	$('#filePick').click();
}
async function save() {
	if (!data) return;
	const errs = countIssues('error');
	if (errs && !confirm(`There ${errs === 1 ? 'is 1 error' : 'are ' + errs + ' errors'} in the sets (see the red markers). Save anyway?`)) return;
	const text = serialize(data);
	try {
		if (mode === 'server') {
			const r = await fetch('/api/sets', { method: 'PUT', headers: { 'X-Set-Editor': '1', 'Content-Type': 'application/json' }, body: text });
			if (!r.ok) throw new Error(await r.text());
			toast('Saved ' + fileName, 'good');
		} else if (mode === 'fs' && fsHandle) {
			const w = await fsHandle.createWritable();
			await w.write(text); await w.close();
			toast('Saved ' + fileName, 'good');
		} else {
			const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: fileName || 'sets.json' });
			document.body.append(a); a.click(); a.remove();
			toast(`Downloaded ${fileName || 'sets.json'} — replace the file in your repo`, 'good');
		}
		baseline = text;
	} catch (e) { toast('Save failed: ' + e.message, 'error'); }
	renderChrome();
}

/* ---------------------------------------------------------------- wiring */
$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
$('#btnSave').onclick = save;
$('#btnOpen').onclick = openFile;
$('#btnRaw').onclick = () => { showRaw = !showRaw; render(); };
$('#filePick').onchange = e => { const f = e.target.files[0]; if (f) f.text().then(t => loadText(t, f.name, 'upload')); e.target.value = ''; };
document.addEventListener('keydown', e => {
	const mod = e.ctrlKey || e.metaKey;
	if (!mod) return;
	const k = e.key.toLowerCase();
	if (k === 's') { e.preventDefault(); save(); }
	else if (k === 'z' || k === 'y') {
		const a = document.activeElement;
		if (a && a.tagName === 'INPUT' && a.type === 'text' && a.value) return; // let the browser undo typing
		e.preventDefault();
		if (k === 'y' || e.shiftKey) redo(); else undo();
	}
});
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

(async function boot() {
	renderChrome();
	renderShell();
	try {
		const r = await fetch('/api/sets');
		if (r.ok) {
			const j = await r.json();
			return loadText(j.text, j.file, 'server');
		}
	} catch (e) { /* not served by server.mjs */ }
})();
</script>
</body>
